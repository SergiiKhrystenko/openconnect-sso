[project]
name = "openconnect-sso"
version = "0.9.0"
description = "Wrapper script for OpenConnect supporting Azure AD (SAMLv2) authentication to Cisco SSL-VPNs"
license = "GPL-3.0-only"
authors = [
    {name = "László Vaskó", email = "laszlo.vasko@outlook.com"},
    {name = "Sergii Khrystenko", email = "sergseriy@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Networking",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "attrs>=23.2",
    "colorama>=0.4.6",
    "lxml>=5.2",
    "keyring>=24.3",
    "prompt-toolkit>=3.0.43",
    "pyxdg>=0.28",
    "requests>=2.32",
    "structlog>=24.1",
    "toml>=0.10.2",
    "PySocks>=1.7.1",
    "PyQt6>=6.7",
    "PyQt6-WebEngine>=6.7",
    "pyotp>=2.9",
]

[project.urls]
Homepage = "https://github.com/SergiiKhrystenko/openconnect-sso"
Repository = "https://github.com/SergiiKhrystenko/openconnect-sso"

[project.scripts]
openconnect-sso = "openconnect_sso.cli:main"

[project.optional-dependencies]
test = [
    "coverage_enable_subprocess>=1.0",
    "pytest>=8.2",
    "black>=24.4",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0",
    "pytest-httpserver>=1.0.10",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"

[tool.black]
target-version = ["py312", "py313"]

[tool.poetry]
packages = [{include = "openconnect_sso"}]
include = ["openconnect_sso/browser/user.js"]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
